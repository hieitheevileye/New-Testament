name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build and verify the full New Testament data (7,957 verses)
        run: python3 tools/build_red.py
      - run: npm install
      - run: npx cap add android
      - name: Generate app icons from assets/
        run: |
          npm install --no-save @capacitor/assets@3
          npx capacitor-assets generate --android --iconBackgroundColor '#f8f0dc' --iconBackgroundColorDark '#f8f0dc'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: new-testament-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
